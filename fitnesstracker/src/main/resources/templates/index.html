<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        .title-box {
            background-color: #4CAF50; /* simple green */
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            font-size: 40px;     /* big icon size */
            margin-right: 10px;
        }

        .summary-number {
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .form-inline .form-control {
            display: inline-block;
            width: auto;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <!-- Title with Bootstrap Icon -->
    <div class="title-box">
        <i class="bi bi-stopwatch logo-icon"></i>
        <span>Fitness Tracker</span>
    </div>

    <!-- Summary -->
    <div class="mb-2">
        <p class="mb-1">You currently have <span th:text="${records.size()}"></span> running records.</p>
        <p>Total Mileage: <span class="summary-number" th:text="${totalMileage}"></span></p>
    </div>

    <!-- Add Run Form -->
    <form th:action="@{/add}" method="post" class="form-inline mb-3">
        <input type="text" class="form-control" name="route" placeholder="Route" required>
        <input type="number" step="0.1" class="form-control" name="miles" placeholder="Miles" required>
        <input type="text" class="form-control" name="date" placeholder="YYYY-MM-DD" required>
        <button type="submit" class="btn btn-success">Add Run</button>
    </form>

    <!-- Table of Runs -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Route</th>
            <th>Miles</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="run : ${records}">
            <td th:text="${run.route}"></td>
            <td th:text="${run.miles}"></td>
            <td th:text="${run.date}"></td>
            <td>
                <a th:href="@{'/delete/' + ${run.id}}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
